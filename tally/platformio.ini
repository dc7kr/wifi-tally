; vTally Light firmware (Arduino framework, ESP8266 + ESP32)
;
;   pio run -e nodemcuv2                 build for ESP8266 (NodeMCU)
;   pio run -e esp32dev                  build for ESP32
;   pio run -e nodemcuv2 -t upload       flash firmware
;   pio run -e nodemcuv2 -t uploadfs     upload data/tally-settings.ini
;   pio test -e native                   run unit tests on the host

[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

[env:esp32dev]
platform = espressif32
board = esp32dev

; add more boards by copying one of the sections above and changing `board`
; (pins are configured per chip family in src/Board.h)

[env:native]
platform = native
framework =
lib_deps =
build_src_filter = -<*>
test_framework = unity
build_flags = -std=gnu++17
