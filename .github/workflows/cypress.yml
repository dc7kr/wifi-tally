# tests a released hub (a *.tar.gz or *.zip of a build) on a variety of operating systems and browsers

name: cypress
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch (where cypress tests are pulled from)'
        required: true
        default: 'main'
      source:
        description: 'URL of the hub archive (*.tar.gz for Linux and macOS, *.zip for Windows; from S3 or releases)'
        required: true
env:
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODEJS_VERSION: 16

jobs:
  # @see https://github.com/cypress-io/github-action
  cypress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: macos-latest
            browser: chrome
          - os: windows-latest
            browser: edge
    runs-on: "${{ matrix.os }}"
    steps:
      - # the source code is ONLY used to to get the cypress tests
        name: Checkout the source code
        uses: actions/checkout@v2
        with:
          ref: "${{ github.event.inputs.branch }}"
      - name: Use node.js ${{ env.NODEJS_VERSION }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODEJS_VERSION }}
      - name: Download the hub
        shell: bash
        run: |
          mkdir hub
          curl -L -f -o hub/archive "${{ github.event.inputs.source }}"
          cd hub
          if [[ "${{ github.event.inputs.source }}" == *.zip ]]; then
            7z x archive
          else
            tar -xzf archive
          fi
          # the archive contains one directory, which holds the executable and the frontend
          mv */* . || true
      - # this step also runs "npm ci" and takes care of caching
        name: Cypress run
        uses: cypress-io/github-action@v2
        with:
          working-directory: ./frontend
          start: ../hub/vtally-hub --with-test
          wait-on: 'http://localhost:3000'
          record: true
          spec: "cypress/**/!(manual_)*.spec.ts"
          browser: ${{ matrix.browser }}
          tag: "bundle-test,${{ matrix.os }},${{ matrix.browser }}"
