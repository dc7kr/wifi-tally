name: build
on: 
  push: 
    branches: 
      - '**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
env:
  # Node.js used to build and test the frontend (react-scripts 5 needs at least 14; 16 has builds for arm64 Macs and Windows)
  FRONTEND_NODEJS_VERSION: 16
  PYTHON_VERSION: "3.11"
  AWS_S3_NIGHTLY_BASEURI: https://wifi-tally-nightly.s3.eu-central-1.amazonaws.com
  AWS_S3_NIGHTLY_BUCKET: wifi-tally-nightly
  AWS_S3_NIGHTLY_REGION: eu-central-1
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
defaults:
  run:
    shell: bash
jobs:
  # ###
  #  
  # Detect the version number to use
  # 
  # ###
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.calc.outputs.build_name }}
      author_name: ${{ steps.calc.outputs.author_name }}
      author_email: ${{ steps.calc.outputs.author_email }}
      committer_name: ${{ steps.calc.outputs.committer_name }}
      committer_email: ${{ steps.calc.outputs.committer_email }}
      is_head: ${{ steps.calc.outputs.is_head }}
      branch: ${{ steps.calc.outputs.branch }}
      tag: ${{ steps.calc.outputs.tag }}

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # don't shallow clone! We could not generate a nice build_name otherwise
      - name: Generate parameters
        id: calc
        run: |
          TAG=""
          BUILD_NAME="$(git describe --tags --always)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF:10}"
            BUILD_NAME="${GITHUB_REF:10}"
          fi
          echo "::set-output name=tag::$TAG"
          echo "::set-output name=build_name::$BUILD_NAME"
          echo "::set-output name=author_name::${{ github.event.commits[0].author.name }}"
          echo "::set-output name=author_email::${{ github.event.commits[0].author.email }}"
          echo "::set-output name=committer_name::${{ github.event.commits[0].committer.name }}"
          echo "::set-output name=committer_email::${{ github.event.commits[0].committer.email }}"
          echo "::set-output name=is_head::${{ github.event.commits[0].id == github.event.head_commit.id }}"
          echo "::set-output name=branch::"
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            echo "::set-output name=branch::${GITHUB_REF:11}"
          fi
        shell: bash # we use bash syntax, so this is VERY important
      - name: Output
        run: |
          echo "build_name=${{ steps.calc.outputs.build_name }}"
          echo "author_name=${{ steps.calc.outputs.author_name }}"
          echo "author_email=${{ steps.calc.outputs.author_email }}"
          echo "committer_name=${{ steps.calc.outputs.committer_name }}"
          echo "committer_email=${{ steps.calc.outputs.committer_email }}"
          echo "is_head=${{ steps.calc.outputs.is_head }}"
          echo "branch=${{ steps.calc.outputs.branch }}"
          echo "tag=${{ steps.calc.outputs.tag }}"

  # ###
  #
  # Run the unit tests of the web frontend and make sure it builds
  #
  # ###
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
      - name: Use node.js ${{ env.FRONTEND_NODEJS_VERSION }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.FRONTEND_NODEJS_VERSION }}
      - name: Cache Node.js modules
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

  # ###
  #
  # Cypress tests are integration tests of the hub with its web frontend
  #
  # ###
  # @see https://github.com/cypress-io/github-action
  cypress-run:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
      - run: sudo apt-get -y update
      - run: sudo apt-get install -y libasound2-dev
      - name: Use node.js ${{ env.FRONTEND_NODEJS_VERSION }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.FRONTEND_NODEJS_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('hub-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - name: Build the hub
        run: cargo build --release --locked
        working-directory: ./hub-rs
      - # this step also runs "npm ci" in the frontend and takes care of caching
        name: Cypress run
        uses: cypress-io/github-action@v2
        with:
          build: npm run build
          start: ../hub-rs/target/release/vtally-hub --with-test --frontend-dir build
          wait-on: 'http://localhost:3000'
          working-directory: ./frontend
          record: true
          spec: "cypress/**/!(manual_)*.spec.ts"
          tag: "node-${{ env.FRONTEND_NODEJS_VERSION }},${{ needs.setup.outputs.build_name }}"

  # ###
  #
  # Run the unit tests of the code running on the tally light on the host
  #
  # ###
  tally-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache PlatformIO
        uses: actions/cache@v2
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('tally/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Test
        run: pio test -e native
        working-directory: ./tally

  # ###
  #
  # Build the firmware that runs on the tally light, once per supported chip
  #
  # ###
  tally-build:
    runs-on: ubuntu-latest
    needs:
      - setup
      - tally-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp8266
            pio_env: nodemcuv2
          - chip: esp32
            pio_env: esp32dev
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache PlatformIO
        uses: actions/cache@v2
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.pio_env }}-${{ hashFiles('tally/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -e ${{ matrix.pio_env }}
        working-directory: ./tally
      - name: Collect files
        run: |
          mkdir -p out
          # firmware.bin is always there; the ESP32 additionally needs a bootloader and a partition table
          for f in firmware.bin bootloader.bin partitions.bin; do
            if [ -f ".pio/build/${{ matrix.pio_env }}/$f" ]; then
              cp ".pio/build/${{ matrix.pio_env }}/$f" out/
            fi
          done
          cp data/tally-settings.ini.example out/
        working-directory: ./tally
      - name: Archive
        uses: actions/upload-artifact@v2
        with:
          name: tally-${{ matrix.chip }}
          path: ./tally/out
          if-no-files-found: error
          retention-days: 1


  # ###
  #
  # Unit tests of the Rust hub
  #
  # ###
  hub-rs-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hub-rs
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
      - name: Cache cargo
        uses: actions/cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('hub-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Install the ALSA headers (MIDI)
        run: sudo apt-get -y update && sudo apt-get install -y libasound2-dev
        working-directory: .
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  # ###
  #
  # Build the Rust hub including the web frontend, once per platform
  #
  # ###
  hub-rs-package:
    needs:
      - setup
      - hub-rs-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-13
            name: macos-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
          - os: windows-11-arm
            name: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Use node.js ${{ env.FRONTEND_NODEJS_VERSION }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.FRONTEND_NODEJS_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('hub-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - name: Install the ALSA headers (MIDI)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get -y update && sudo apt-get install -y libasound2-dev
      - name: Package
        run: |
          BUILD_NAME="${{ needs.setup.outputs.build_name }}"
          ./package.sh --version "${BUILD_NAME#v}"
        working-directory: ./hub-rs
      - name: Archive
        uses: actions/upload-artifact@v2
        with:
          name: hub-rs-${{ matrix.name }}
          path: |
            ./hub-rs/dist/*.tar.gz
            ./hub-rs/dist/*.zip
          if-no-files-found: error
          retention-days: 1

  # ###
  # 
  # Render documentation
  # 
  # ###
  documentation:
    # @TODO: also use ubuntu-latest once Github finished migration to 20.04
    # all we want is a python that is NOT 2.7 - d'oh!
    runs-on: ubuntu-20.04 
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v2
      - name: Cache pip
        uses: actions/cache@v2
        with:
          # This path is specific to Ubuntu
          path: ~/.cache/pip
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-pip-${{ hashFiles('${{ github.workspace }}/documentation/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --user
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
        working-directory: ./documentation
      - name: "Log Environment"
        run: |
          echo "::group::Environment Variables"
          env | sort
          echo "::endgroup::"
          echo "::group::Pip"
          python --version
          python -m pip list
          echo "::endgroup::"
      - name: "Build"
        run: |
          mkdocs build
        working-directory: ./documentation
      - name: Archive HTML
        uses: actions/upload-artifact@v2
        with:
          name: documentation-html
          path: ./documentation/site
          if-no-files-found: error
          retention-days: 1
      - name: Archive markdown
        uses: actions/upload-artifact@v2
        with:
          name: documentation-markdown
          path: ./documentation/docs
          if-no-files-found: error
          retention-days: 1

  # ###
  #
  # Publish the documentation
  #
  # ###
  documentation-publish:
    # only publish when on main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: 
      - documentation
      - setup
    runs-on: ubuntu-latest
    env:
      PAGES_REPO: wifi-tally/wifi-tally.github.io
    steps:
      - name: Checkout Pages
        uses: actions/checkout@v2
        with: 
          repository: ${{ env.PAGES_REPO }}
          ref: main
          token: ${{ secrets.PAGES_TOKEN }}
          path: .
          fetch-depth: 1
      - uses: actions/download-artifact@v2
        with:
          name: documentation-html
          path: .
      - name: Commit changes
        run: |
          if [ $(git status --porcelain | wc -l) == "0" ]; then
            echo "No changes in the documentation"
          else
            git config user.email "bot@xopn.de"
            git config user.name "Xopn Bot"
            git add .
            git commit -m "update for ${{ needs.setup.outputs.build_name }}" --date "$(date)"
          fi
      - name: Push Pages
        uses: ad-m/github-push-action@master
        with:
          repository: ${{ env.PAGES_REPO }}
          github_token: ${{ secrets.PAGES_TOKEN }}
          branch: main

  # ###
  # 
  # Upload firmware and code
  # 
  # ###
  tally-upload:
    needs: 
      - tally-build
      - setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip: [esp8266, esp32]
    env:
      BUILD_NAME: ${{ needs.setup.outputs.build_name }}
    steps:
      - name: Get Tally
        uses: actions/download-artifact@v2
        with:
          name: tally-${{ matrix.chip }}
          path: ${{ github.workspace }}/${{ matrix.chip }}
      - name: Zip it
        run: |
          BUILD_NAME=${BUILD_NAME/#v/}
          zip -Jrq "${GITHUB_WORKSPACE}/vtally-${BUILD_NAME}-${{ matrix.chip }}.zip" *
        working-directory: ${{ github.workspace }}/${{ matrix.chip }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_NIGHTLY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_NIGHTLY_KEY }}
          aws-region: ${{ env.AWS_S3_NIGHTLY_REGION }}
      - name: Push artifact to AWS S3
        id: aws
        run: |
          # strip the "v" in front of the version
          BUILD_NAME=${BUILD_NAME/#v/}
          S3_PREFIX="vtally-${BUILD_NAME}"
          ARTIFACT_FILENAME="vtally-${BUILD_NAME}-${{ matrix.chip }}.zip"
          aws s3 cp "${ARTIFACT_FILENAME}" "s3://${AWS_S3_NIGHTLY_BUCKET}/${S3_PREFIX}/${ARTIFACT_FILENAME}" --acl public-read
          echo "::warning ::Artifact is available at ${AWS_S3_NIGHTLY_BASEURI}/${S3_PREFIX}/${ARTIFACT_FILENAME} for the next days."

  # ###
  #
  # Upload the hub for every platform
  #
  # ###
  hub-upload:
    needs:
      - hub-rs-package
      - setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [linux-x86_64, linux-arm64, macos-x86_64, macos-arm64, windows-x86_64, windows-arm64]
    env:
      BUILD_NAME: ${{ needs.setup.outputs.build_name }}
    steps:
      - name: Get the hub
        uses: actions/download-artifact@v2
        with:
          name: hub-rs-${{ matrix.name }}
          path: ${{ github.workspace }}/hub
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_NIGHTLY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_NIGHTLY_KEY }}
          aws-region: ${{ env.AWS_S3_NIGHTLY_REGION }}
      - name: Push artifact to AWS S3
        run: |
          # strip the "v" in front of the version
          BUILD_NAME=${BUILD_NAME/#v/}
          S3_PREFIX="vtally-${BUILD_NAME}"
          for ARTIFACT_FILENAME in *; do
            aws s3 cp "${ARTIFACT_FILENAME}" "s3://${AWS_S3_NIGHTLY_BUCKET}/${S3_PREFIX}/${ARTIFACT_FILENAME}" --acl public-read
            echo "::warning ::Artifact is available at ${AWS_S3_NIGHTLY_BASEURI}/${S3_PREFIX}/${ARTIFACT_FILENAME} for the next days."
          done
        working-directory: ${{ github.workspace }}/hub
